<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f5">
  <!-- <meta name="api-base" content="http://localhost:8000"> -->
  <meta name="api-base" content="">
  <title>OnRecord - Receipt In, Record Out</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
<!-- <body style="background: url('receipts-bg.png') center / cover;"> -->
  <header id="topnav" class="topnav">
    <div class="nav-inner">
      <button class="ll-wordmark brand-btn" type="button" data-page="home" aria-label="Open home">
        <span class="ll-mark" aria-hidden="true">OR</span>
        <span class="ll-brand-text">OnRecord</span>
      </button>

      <nav id="nav" class="nav-list" aria-label="Main navigation">
        <button class="nav-btn" type="button" data-page="home">Home</button>
        <button class="nav-btn" type="button" data-page="upload">Extract</button>
        <button class="nav-btn" type="button" data-page="review">Review</button>
        <button class="nav-btn" type="button" data-page="records">Records</button>
      </nav>

      <button id="theme" class="theme-btn" type="button" aria-label="Switch to dark mode">
        <span aria-hidden="true">&#9789;</span>
      </button>
    </div>
  </header>

  <main id="main" class="main" tabindex="-1"></main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript>
    <div class="no-js">JavaScript is required to use OnRecord.</div>
  </noscript>

  <template id="home-page">
    <section class="home-hero">
      <div class="home-grid">
        <div>
          <div class="ll-home-copy rise">
            <h1>
              Receipt in.<br>
              <span>Record out.</span>
            </h1>

            <h2>
              Upload a receipt or invoice, check the details,
              and save it to the records.
            </h2>
          </div>

          <button class="btn primary hero-btn" type="button" data-go="upload">
            Extract document
          </button>
        </div>

        <div>
          <div class="ll-receipt-wrap" aria-hidden="true">
            <div class="ll-receipt-pin"></div>

            <div class="ll-home-receipt">
              <div class="ll-receipt-store">Corner Shop</div>
              <div class="ll-receipt-meta">12 July | Receipt 1842</div>

              <div class="ll-receipt-line">
                <span>Bread and milk</span>
                <span>$8.40</span>
              </div>

              <div class="ll-receipt-line">
                <span>Kitchen items</span>
                <span>$11.75</span>
              </div>

              <div class="ll-receipt-line">
                <span>Tax</span>
                <span>$1.61</span>
              </div>

              <div class="ll-receipt-total">
                <span>Total</span>
                <span>$21.76</span>
              </div>

              <div class="ll-receipt-note">checked</div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <div class="ll-home-stats rise-1">
      <div class="ll-home-stat">
        <span class="value" data-x="all">-</span>
        <span class="label">Uploaded</span>
      </div>

      <div class="ll-home-stat">
        <span class="value" data-x="ok">-</span>
        <span class="label">Approved</span>
      </div>

      <div class="ll-home-stat">
        <span class="value" data-x="wait">-</span>
        <span class="label">Needs review</span>
      </div>
    </div>
  </template>

  <template id="upload-page">
    <div class="ll-page-head">
      <div class="ll-page-title rise">Extract documents</div>
      <div class="ll-page-sub rise-1">
        Choose one or more JPG or PNG files. They are read one after another.
      </div>
    </div>

    <section class="upload-workspace">
      <div class="upload-grid">
        <div>
          <div class="ll-upload-copy">
            <h3>Choose files</h3>
            <p>Add a single receipt or a whole batch.</p>

            <div class="ll-upload-help">
              <span>JPG or PNG</span>
              <span>One document per image</span>
              <span>Up to 25 per batch</span>
            </div>
          </div>

          <label class="dropzone" id="drop">
            <input
              class="file-input"
              id="file"
              type="file"
              accept="image/jpeg,image/png,.jpg,.jpeg,.png"
              multiple
              hidden
            >

            <span class="dropzone-inner">
              <b>Drop receipts or invoices</b>
              <small>JPG or PNG, one or many</small>
              <span class="choose-btn">Browse files</span>
            </span>
          </label>

          <div class="upload-actions">
            <button class="btn primary full" id="run" type="button" disabled>
              Extract documents
            </button>
            <p class="upload-note" id="upload-note">Choose files to start.</p>
          </div>
        </div>

        <div id="preview">
          <div class="ll-empty-preview">
            <div class="ll-empty-icon"></div>
            <b>No files selected</b>
            <p>Your receipts will appear here.</p>
          </div>
        </div>
      </div>
    </section>

    <div id="result" aria-live="polite"></div>
  </template>

  <template id="batch-results">
    <div class="ll-rule">Extraction results</div>

    <div class="batch-progress">
      <div class="batch-progress-bar">
        <span id="pbar"></span>
      </div>
      <p class="batch-progress-text" id="ptext">Starting...</p>
    </div>

    <div class="ll-table-wrap">
      <table class="ll-table">
        <thead>
          <tr>
            <th>File</th>
            <th>Status</th>
            <th>Vendor</th>
            <th>Total</th>
            <th>Held</th>
            <th>Cost</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="brows"></tbody>
      </table>
    </div>

    <div class="batch-actions" id="bactions"></div>
  </template>

  <template id="review-page">
    <div class="page-top">
      <div class="ll-page-head">
        <div class="ll-page-title rise">Review queue</div>
        <div class="ll-page-sub rise-1">
          Check the document, fix any values, then approve or reject it.
        </div>
      </div>

      <button class="btn secondary small" type="button" id="reload">
        &#x27F3;
      </button>
    </div>

    <div id="review-box">
      <div class="loader">Loading the review queue...</div>
    </div>
  </template>

  <template id="records-page">
    <div class="ll-page-head">
      <div class="ll-page-title rise">Records</div>
      <div class="ll-page-sub rise-1">
        See every processed document. Open a row to view the image and details.
      </div>
    </div>

    <div id="records-box">
      <div class="loader">Loading documents...</div>
    </div>
  </template>

  <template id="records-list">
    <div class="ll-summary-strip">
      <div class="ll-summary-item">
        <span class="ll-summary-value" data-total="auto">0</span>
        <span class="ll-summary-label">Auto approved</span>
      </div>

      <div class="ll-summary-item">
        <span class="ll-summary-value" data-total="approved">0</span>
        <span class="ll-summary-label">Approved</span>
      </div>

      <div class="ll-summary-item">
        <span class="ll-summary-value" data-total="review">0</span>
        <span class="ll-summary-label">Needs review</span>
      </div>

      <div class="ll-summary-item">
        <span class="ll-summary-value" data-total="bad">0</span>
        <span class="ll-summary-label">Rejected or blocked</span>
      </div>

      <div class="ll-summary-item">
        <span class="ll-summary-value" data-total="cost">$0.0000</span>
        <span class="ll-summary-label">Processing cost</span>
      </div>
    </div>

    <div class="ll-rule">All documents</div>

    <div class="records-wrap">
      <div class="records">
        <div class="records-head">
          <span class="ll-col-head">File</span>
          <span class="ll-col-head">Status</span>
          <span class="ll-col-head">Vendor</span>
          <span class="ll-col-head">Total</span>
          <span class="ll-col-head">Ingested</span>
          <span class="ll-col-head"></span>
        </div>
      </div>
    </div>
  </template>
</body>
</html>
