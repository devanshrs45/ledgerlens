services:
  api:
    build: .
    ports:
      - "8000:8080"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.groq.com/openai/v1}
      - VISION_MODEL=${VISION_MODEL:-meta-llama/llama-4-scout-17b-16e-instruct}
      - STRUCTURED_OUTPUT_MODE=${STRUCTURED_OUTPUT_MODE:-json}
      - MODERATION_ENABLED=${MODERATION_ENABLED:-false}
      - REVIEW_THRESHOLD=${REVIEW_THRESHOLD:-0.75}
      - PORT=8080
    volumes:
      - ledger_data:/srv/data
      - ledger_uploads:/srv/uploads
  ui:
    build: ./ui
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8080
    depends_on:
      - api
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
volumes:
  ledger_data:
  ledger_uploads: